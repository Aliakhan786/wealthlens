name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check core pipeline analytics backend ai tests
      - name: Unit + API tests (offline sample data, no secrets needed)
        run: pytest -q
      - name: AI guardrail evaluation (offline agent)
        env: { OFFLINE_MODE: "true", ENABLE_SCHEDULER: "false" }
        run: |
          python -m pipeline seed --offline
          python -m ai.eval.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wealthlens-api .
      - run: docker build -t wealthlens-web ./frontend
